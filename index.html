<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR Edukasi Jenis Ikan</title>

  <!-- === LIBRARY === -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.139.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/three.js/build/ar-threex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.139.2/examples/js/loaders/GLTFLoader.js"></script>

  <!-- Script utama -->
  <script defer src="script.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: black;
      font-family: sans-serif;
      touch-action: none;
    }

    canvas {
      width: 100vw !important;
      height: 100vh !important;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
    }

    /* ================= LANDING PAGE ================= */
    #landingPage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 9999;
    }

    #bgVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .landing-overlay {
      position: relative;
      z-index: 2;
      background: rgba(0, 0, 0, 0.55);
      padding: 40px 30px;
      border-radius: 16px;
      text-align: center;
      color: white;
      max-width: 420px;
      margin: auto;
      top: 50%;
      transform: translateY(-50%);
      backdrop-filter: blur(4px);
    }

    .landing-overlay h1 {
      font-size: 26px;
      margin-bottom: 10px;
    }

    .landing-overlay p {
      font-size: 14px;
      margin-bottom: 25px;
      opacity: 0.9;
    }

    #startAR {
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      background: #00d4ff;
      color: #002233;
      cursor: pointer;
      font-weight: bold;
    }

    #startAR:hover {
      background: #00b5db;
    }

    /* ================= PANEL KONTROL ================= */
    #sliderContainer {
      position: fixed;
      bottom: 95px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 14px;
      border-radius: 12px;
      color: white;
      display: none;
      gap: 8px;
      align-items: center;
      z-index: 10;
    }

    #scaleSlider {
      width: 120px;
    }

    #resetButton {
      background: #007bff;
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* ================= INFO PANEL ================= */
    #infoPanel {
  position: fixed;
  top: 50%;
  right: 12px;
  transform: translateY(-50%);
  width: 260px;
  max-height: 70vh;
  overflow-y: auto;

  background: rgba(0, 0, 0, 0.7);
  color: white;
  padding: 12px 14px;
  border-radius: 12px;
  z-index: 20;
}

#infoPanel h3 {
  margin: 0 0 6px;
  font-size: 16px;
}

#infoPanel p {
  margin: 0;
  font-size: 13px;
  line-height: 1.4;
}

  </style>
</head>

<body>

  <!-- ========== LANDING PAGE ========== -->
  <div id="landingPage">
    <video id="bgVideo" autoplay muted loop playsinline>
      <source src="laut.mp4" type="video/mp4" />
    </video>

    <div class="landing-overlay">
      <h1>AR Edukasi Jenis-Jenis Ikan</h1>
      <p>Media pembelajaran interaktif berbasis Augmented Reality</p>
      <button id="startAR">Mulai Kamera AR</button>
    </div>
  </div>

  <!-- ========== PANEL KONTROL ========== -->
  <div id="sliderContainer">
    🔧 Ukuran:
    <input id="scaleSlider" type="range" min="0.1" max="5" step="0.1" value="1" />
    <span id="scaleValue">1.0</span>x
    <button id="resetButton">Reset</button>
  </div>

  <!-- ========== PANEL INFORMASI ========== -->
  <div id="infoPanel">
    <h3 id="fishName">Arahkan kamera ke marker</h3>
    <p id="fishDesc">Informasi ikan akan muncul di sini</p>
  </div>

</body>
</html>
